<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WooAI Desc Icon</title>
<style>
body { background:#f0f0f1; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; gap:40px; flex-wrap:wrap; }
.card { text-align:center; }
.card p { font:13px -apple-system, sans-serif; color:#555; margin-top:8px; }
</style>
</head>
<body>

<!-- Option A: AI + Product -->
<div class="card">
<svg width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Magic sparkle / AI -->
  <g transform="translate(52,62)">
    <path d="M72 0L78 20L98 26L78 32L72 52L66 32L46 26L66 20Z" fill="white" opacity="0.9"/>
    <path d="M0 6L3 16L13 19L3 22L0 32L-3 22L-13 19L-3 16Z" fill="white" opacity="0.5"/>
    <path d="M140 50L142 56L148 58L142 60L140 66L138 60L132 58L138 56Z" fill="white" opacity="0.5"/>
  </g>
  <!-- Product box -->
  <g transform="translate(80,142)">
    <rect x="0" y="0" width="96" height="72" rx="12" fill="white" opacity="0.95"/>
    <rect x="28" y="22" width="40" height="28" rx="6" fill="url(#accent)"/>
    <path d="M28 30L48 20L68 30" fill="none" stroke="#4834D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 30L28 52L48 62L68 52L68 30" fill="none" stroke="#4834D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<p>Option A — AI Spark + Product Box</p>
</div>

<!-- Option B: Wand + Cart -->
<div class="card">
<svg width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#00A381"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#b2)"/>
  <!-- Cart body -->
  <g transform="translate(48,118)">
    <path d="M24 60L6 0H154L136 60H24Z" fill="white" opacity="0.95"/>
    <circle cx="36" cy="78" r="12" fill="white" opacity="0.3"/>
    <circle cx="124" cy="78" r="12" fill="white" opacity="0.3"/>
  </g>
  <!-- Wand / AI pen -->
  <g transform="translate(164,42) rotate(-20)">
    <rect x="0" y="0" width="8" height="60" rx="4" fill="white" opacity="0.9"/>
    <rect x="-2" y="-8" width="12" height="16" rx="6" fill="white" opacity="0.9"/>
  </g>
  <!-- Sparkles -->
  <g transform="translate(180,28)">
    <path d="M0 0L2 4L6 6L2 8L0 12L-2 8L-6 6L-2 4Z" fill="#FFEAA7"/>
    <path d="M20 20L21 23L24 24L21 25L20 28L19 25L16 24L19 23Z" fill="#FFEAA7" opacity="0.6"/>
  </g>
</svg>
<p>Option B — Wand + Cart</p>
</div>

<!-- Option C: Minimal Brain + Tag -->
<div class="card">
<svg width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="100%" stop-color="#636E72"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#b3)"/>
  <!-- Brain / AI nodes -->
  <g transform="translate(64,60)">
    <circle cx="64" cy="72" r="48" fill="none" stroke="white" stroke-width="5" opacity="0.3"/>
    <circle cx="40" cy="52" r="8" fill="#6C5CE7"/>
    <circle cx="88" cy="52" r="8" fill="#00B894"/>
    <circle cx="64" cy="80" r="8" fill="#FDCB6E"/>
    <circle cx="40" cy="92" r="8" fill="#E17055"/>
    <circle cx="88" cy="92" r="8" fill="#74B9FF"/>
    <line x1="40" y1="52" x2="88" y2="52" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="40" y1="52" x2="64" y2="80" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="88" y1="52" x2="64" y2="80" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="64" y1="80" x2="40" y2="92" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="64" y1="80" x2="88" y2="92" stroke="white" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- Price tag -->
  <g transform="translate(148,168)">
    <path d="M0 0H60L80-20V-72L60-52H0V0Z" fill="white" opacity="0.95"/>
    <text x="20" y="-32" font-size="22" font-weight="700" fill="#2D3436" font-family="sans-serif">AI</text>
  </g>
</svg>
<p>Option C — AI Nodes + Price Tag</p>
</div>

</body>
</html>
